# Author: mikaeil297
name: Workflow A

on:
  schedule:
    - cron: '0 0,12 * * *'   # runs at 00:00 and 12:00 UTC
  workflow_dispatch:          # allows manual trigger

concurrency:
  group: workflow-a
  cancel-in-progress: true

jobs:
  main-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Python, Flask, ngrok)
        run: |
          sudo apt-get update
          pip install flask
          wget -q -O ngrok.zip https://bin.equinox.io/c/4VmDzA7iaHb/ngrok-stable-linux-amd64.zip
          unzip -o ngrok.zip
          chmod +x ngrok
          ./ngrok authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Start Web Shell and print URL
        run: |
          ./ngrok http 8080 > /dev/null 2>&1 &
          sleep 5
          URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
          echo "✅ Web Shell URL (active for ~6 hours): $URL"
          echo "🔥 Open this URL in your browser. Use admin/admin123 to login."

          python web_shell.py

      - name: Trigger Workflow B (only if started by schedule)
        if: github.event_name == 'schedule'
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/b.yml/dispatches \
            -d '{"ref":"${{ github.ref }}"}' 
