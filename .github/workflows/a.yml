# Author: mikaeil297
name: Workflow A

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:
    inputs:
      stop:
        description: 'Set to "true" to stop this workflow'
        required: false
        default: 'false'

concurrency:
  group: workflow-a
  cancel-in-progress: true

jobs:
  main-job:
    runs-on: ubuntu-latest
    steps:
      - name: Check if stop signal received
        if: github.event.inputs.stop == 'true'
        run: |
          echo "🛑 Stop signal received. Exiting workflow A."
          exit 0

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          pip install flask
          wget -q -O ngrok.zip https://bin.equinox.io/c/4VmDzA7iaHb/ngrok-stable-linux-amd64.zip
          unzip -o ngrok.zip
          chmod +x ngrok
          ./ngrok authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Start Web Shell
        run: |
          ./ngrok http 8080 > /dev/null 2>&1 &
          sleep 5
          URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
          echo "✅ Web Shell URL: $URL"
          python web_shell.py

      - name: Trigger Workflow B
        if: github.event_name == 'schedule'
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/b.yml/dispatches \
            -d '{"ref":"${{ github.ref }}"}' 
