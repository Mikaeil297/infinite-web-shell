# Author: mikaeil297
name: Workflow C - Stopper

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "stop" to confirm'
        required: true
        default: 'stop'

jobs:
  stop-everything:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm stop request
        if: github.event.inputs.confirm != 'stop'
        run: |
          echo "❌ Confirmation failed. Please type 'stop' in the input field."
          exit 1

      - name: Stop Workflow A
        run: |
          echo "🛑 Sending stop signal to Workflow A..."
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/a.yml/dispatches \
            -d '{"ref":"${{ github.ref }}", "inputs": {"stop": "true"}}'

      - name: Stop Workflow B
        run: |
          echo "🛑 Sending stop signal to Workflow B..."
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/b.yml/dispatches \
            -d '{"ref":"${{ github.ref }}", "inputs": {"stop": "true"}}'

      - name: Cancel own workflow (self-destruct)
        run: |
          echo "💣 Stopping Workflow C itself..."
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel
