# Author: mikaeil297
name: Workflow B

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:
    inputs:
      stop:
        description: 'Set to "true" to stop this workflow'
        required: false
        default: 'false'

concurrency:
  group: workflow-b
  cancel-in-progress: true

jobs:
  main-job:
    runs-on: ubuntu-latest
    steps:
      - name: Check if stop signal received
        if: github.event.inputs.stop == 'true'
        run: |
          echo "🛑 Stop signal received. Exiting workflow B."
          exit 0

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          pip install flask
          wget -q -O ngrok.zip https://bin.equinox.io/c/4VmDzA7iaHb/ngrok-stable-linux-amd64.zip
          unzip -o ngrok.zip
          chmod +x ngrok
          ./ngrok authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Start Web Shell
        run: |
          ./ngrok http 8080 --log=stdout > ngrok.log 2>&1 &
          echo "⏳ Waiting for ngrok to start..."
          sleep 15

          URL=""
          for i in {1..5}; do
            RESPONSE=$(curl -s http://localhost:4040/api/tunnels)
            URL=$(echo "$RESPONSE" | grep -o '"public_url":"[^"]*"' | head -1 | sed 's/"public_url":"\(.*\)"/\1/')
            if [ -n "$URL" ]; then
              echo "✅ Web Shell URL: $URL"
              break
            else
              echo "⚠️ Attempt $i failed. Retrying in 3 seconds..."
              sleep 3
            fi
          done

          if [ -z "$URL" ]; then
            echo "❌ Failed to get ngrok URL. Debug info:"
            echo "--- ngrok.log ---"
            cat ngrok.log
            echo "--- API response ---"
            curl -s http://localhost:4040/api/tunnels
            exit 1
          fi

          python web_shell.py

      - name: Trigger Workflow A
        if: github.event_name == 'schedule'
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/a.yml/dispatches \
            -d '{"ref":"${{ github.ref }}"}'
